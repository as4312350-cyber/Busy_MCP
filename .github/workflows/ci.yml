name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - run: bandit -q -r src -c pyproject.toml
      - name: Audit runtime dependencies
        run: |
          printf 'mcp>=1.10,<3\npyodbc>=5.0\nanyio>=4\npydantic>=2.5\nuvicorn>=0.27\n' > runtime-reqs.txt
          pip-audit -r runtime-reqs.txt

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }}, mcp ${{ matrix.mcp }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
        mcp: ["<2", ">=2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: pip install -e ".[dev]" "mcp${{ matrix.mcp }}"
      - run: pytest --cov --cov-report=term-missing -W error::ResourceWarning

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/busy-mcp --version
          /tmp/wheel-test/bin/python -c "import busy_mcp.server, busy_mcp.cli; print('import ok')"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
