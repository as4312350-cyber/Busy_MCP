[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "busy-mcp"
dynamic = ["version"]
description = "Read-only Model Context Protocol (MCP) server that lets AI assistants query BUSY Accounting Software data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Busy MCP contributors" }]
keywords = ["mcp", "busy", "accounting", "india", "gst", "claude", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp>=1.10,<3",
    "pyodbc>=5.0",
    "anyio>=4",
    "pydantic>=2.5",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
# Linters and checkers are pinned so local runs and CI always agree; Dependabot proposes upgrades.
dev = [
    "pytest>=8", "pytest-cov>=5", "httpx>=0.27",
    "ruff==0.17.3", "mypy==2.4.1", "bandit==1.9.4", "pip-audit==2.10.1",
]

[project.scripts]
busy-mcp = "busy_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/as4312350-cyber/Busy_MCP"
Issues = "https://github.com/as4312350-cyber/Busy_MCP/issues"

[tool.setuptools.dynamic]
version = { attr = "busy_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
busy_mcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["busy_mcp"]
omit = ["*/db/drivers.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = [
    "S608",   # SQL built from our own constants/ints; user SQL goes through sqlguard
    "S101",   # asserts in tests
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]

[tool.mypy]
python_version = "3.10"
files = ["src/busy_mcp"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.bandit]
# B608: every interpolated SQL fragment is a code constant, an int()-cast value, or a
# table/column name taken from the database catalog. Free-form SQL from the client goes
# through sqlguard.validate_select instead. Audited for 1.0.0 (see SECURITY.md).
skips = ["B608"]
