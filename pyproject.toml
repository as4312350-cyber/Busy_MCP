[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "busy-mcp"
version = "0.1.0"
description = "Read-only MCP server that lets any AI assistant query BUSY Accounting Software data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "pyodbc>=5.0",
    "anyio>=4",
    "pydantic>=2",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
busy-mcp = "busy_mcp.server:main"

[tool.setuptools]
packages = ["busy_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
